<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <link rel="stylesheet" href="../css/head.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="head">
        <div class="nav-menu">
            <div class="head-img"><img src="电影.png" alt="logo"></div>
            <a class="nav-item" href="cinema.html">首页</a>
            <a class="nav-item" href="movie.html">电影</a>
            <a class="nav-item" href="cinema-detail.html">影院</a>
        </div>
    </div>

    <div class="change-container">
        <div class="change-card">
            <h2>修改密码</h2>
            <div class="form-group">
                <label for="oldPwd">原始密码</label>
                <input type="password" id="oldPwd" placeholder="请输入原始密码" autocomplete="current-password">
            </div>
            <div class="form-group">
                <label for="newPwd">新密码</label>
                <input type="password" id="newPwd" placeholder="请输入新密码" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirmPwd">确认密码</label>
                <input type="password" id="confirmPwd" placeholder="请再次输入新密码" autocomplete="new-password">
            </div>
            <button class="change-btn" id="changeBtn" onclick="doChange()">确认修改</button>
            <div class="msg" id="msg"></div>
            <a class="back-link" href="login.html">返回登录</a>
        </div>
    </div>

    <script src="../js/change-password.js"></script>
</body>
</html>
