<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        /* ===== head.css (global + nav) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');
        :root {
            --cinema-black: #faf8f5; --cinema-dark: #f0ede6; --cinema-surface: #ffffff;
            --cinema-red: #c0392b; --cinema-red-bright: #d63031; --cinema-gold: #b8942e;
            --cinema-gold-light: #c9a84c; --cinema-amber: #f4a261; --cinema-text: #2c2416;
            --cinema-text-muted: #6b5d4f; --cinema-text-dim: #9b8d7e; --cinema-border: #d4cfc4;
            --cinema-overlay: rgba(0, 0, 0, 0.08);
            --cinema-accent-text: #1a1a19;
            --font-display: 'Cinzel', 'Georgia', serif; --font-body: 'EB Garamond', 'Georgia', serif;
        }
        body {
            font-family: var(--font-body); background: var(--cinema-black); color: var(--cinema-text);
            min-height: 100vh; -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 9999; opacity: 0.1;
        }
        .head {
            position: fixed; top: 0; left: 0; right: 0; z-index: 999;
            background: linear-gradient(180deg, rgba(250,248,245,0.98) 0%, rgba(250,248,245,0.92) 100%);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--cinema-border);
        }
        .nav-menu {
            display: flex; align-items: center; justify-content: center; height: 64px;
            max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative;
        }
        .head-img {
            position: absolute; left: 20px; width: 44px; height: 44px;
            flex-shrink: 0; transition: filter 0.3s;
        }
        .head-img:hover { filter: brightness(1.2); }
        .head-img img { width: 100%; height: 100%; object-fit: contain; }
        .nav-item-active, .nav-item {
            text-decoration: none; padding: 20px 36px; margin: 0 20px;
            font-family: var(--font-display); font-size: 14px; letter-spacing: 3px;
            text-transform: uppercase; position: relative; transition: color 0.3s;
        }
        .nav-item { color: var(--cinema-text-muted); }
        .nav-item-active { color: var(--cinema-gold); }
        .nav-item::after, .nav-item-active::after {
            content: ''; position: absolute; bottom: 12px; left: 50%;
            transform: translateX(-50%) scaleX(0); width: 60%; height: 1.5px;
            background: var(--cinema-gold); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .nav-item-active::after { transform: translateX(-50%) scaleX(1); }
        .nav-item:hover { color: var(--cinema-gold-light); }
        .nav-item:hover::after { transform: translateX(-50%) scaleX(1); }
        .nav-menu::after {
            content: ''; position: absolute; bottom: -1px; left: 10%; right: 10%;
            height: 1px; background: linear-gradient(90deg, transparent, var(--cinema-gold), transparent); opacity: 0.3;
        }

        /* ===== auth.css ===== */
        body {
            background: var(--cinema-black); display: flex; flex-direction: column;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(184,148,46,0.06) 0%, transparent 60%);
        }
        .login-container {
            flex: 1; display: flex; justify-content: center; align-items: center; padding: 100px 40px 40px;
        }
        .login-card {
            background: var(--cinema-surface); border-radius: 12px; padding: 40px 36px 32px;
            width: 380px; border: 1px solid var(--cinema-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.08); position: relative;
        }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 20%; right: 20%;
            height: 1px; background: linear-gradient(90deg, transparent, var(--cinema-gold), transparent); opacity: 0.4;
        }
        .login-card h2 {
            text-align: center; font-size: 26px; color: var(--cinema-gold-light);
            margin-bottom: 32px; letter-spacing: 4px; font-family: var(--font-display); text-transform: uppercase;
        }
        .forgot-pwd {
            display: block; text-align: right; font-size: 13px; color: var(--cinema-text-dim);
            text-decoration: none; margin-top: -12px; margin-bottom: 20px; cursor: pointer; transition: color 0.2s;
        }
        .forgot-pwd:hover { color: var(--cinema-gold-light); }
        .login-btn {
            width: 100%; height: 44px; background: linear-gradient(135deg, var(--cinema-red), #a8382c);
            color: #fff; border: none; border-radius: 8px; font-size: 15px;
            font-weight: 600; letter-spacing: 2px; cursor: pointer; transition: all 0.3s;
            font-family: var(--font-display); text-transform: uppercase;
        }
        .login-btn:hover { box-shadow: 0 4px 20px rgba(192,57,43,0.25); transform: translateY(-1px); }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .error-msg { color: var(--cinema-red-bright); font-size: 14px; text-align: center; margin-top: 12px; min-height: 20px; }
        .form-group { margin-bottom: 24px; }
        .form-group label {
            display: block; font-size: 13px; color: var(--cinema-text-muted);
            margin-bottom: 8px; letter-spacing: 1px; font-weight: 500;
        }
        .form-group input {
            width: 100%; height: 44px; border: 1px solid var(--cinema-border);
            border-radius: 8px; padding: 0 16px; font-size: 15px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s; background: rgba(0,0,0,0.2);
            color: var(--cinema-text); font-family: var(--font-body);
        }
        .form-group input::placeholder { color: var(--cinema-text-dim); }
        .form-group input:focus { border-color: var(--cinema-gold); box-shadow: 0 0 0 3px rgba(184,148,46,0.15); }
    </style>
</head>
<body>
    <div class="head">
        <div class="nav-menu">
            <div class="head-img"><img src="电影.png" alt="logo"></div>
            <a class="nav-item" href="cinema.html">首页</a>
            <a class="nav-item" href="movie.html">电影</a>
            <a class="nav-item" href="cinema.html">影院</a>
        </div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <h2>用户登录</h2>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <a class="forgot-pwd" href="change-password.html">修改密码</a>
            <button class="login-btn" id="loginBtn" onclick="doLogin()">登录</button>
            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <script>
        async function doLogin() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var errorEl = document.getElementById('errorMsg');
            var btn = document.getElementById('loginBtn');
            if (!username || !password) { errorEl.textContent = '请输入用户名和密码'; return; }
            btn.disabled = true; btn.textContent = '登录中...'; errorEl.textContent = '';
            try {
                var resp = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await resp.json();
                if (resp.ok) { localStorage.setItem('user', JSON.stringify(data)); window.location.href = 'USER.html'; }
                else { errorEl.textContent = data.error || '登录失败'; btn.disabled = false; btn.textContent = '登录'; }
            } catch (err) { errorEl.textContent = '网络错误，请稍后重试'; btn.disabled = false; btn.textContent = '登录'; }
        }
        document.getElementById('password').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
