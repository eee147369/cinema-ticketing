<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选座购票</title>
    <link rel="stylesheet" href="../css/head.css">
    <link rel="stylesheet" href="../css/bottom.css">
    <link rel="stylesheet" href="../css/seat.css">
</head>
<body>
    <div class="head">
        <div class="nav-menu">
            <div class="head-img"><img src="电影.png" alt="logo"></div>
            <a class="nav-item" href="cinema.html">首页</a>
            <a class="nav-item" href="movie.html">电影</a>
            <a class="nav-item" href="cinema-detail.html">影院</a>
            <div class="nav-item-two">
                <span class="avatar-inner">
                    <img src="个人.png" alt="用户" class="avatar-img" id="avatarTrigger">
                    <span class="avatar-label">登录</span>
                </span>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a class="dropdown-item" id="profileOption" href="#" data-tab="information">个人信息</a>
                    <a class="dropdown-item" id="ticketOption" href="#" data-tab="ticket">我的购票</a>
                    <a class="dropdown-item" href="#" data-tab="favorite">我的收藏</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item logout-item" id="logoutOption" href="#">退出登录</a>
                </div>
            </div>
            <script src="../js/script.js"></script>
        </div>
    </div>

    <div style="padding-top:60px;"></div>

    <div class="seat-container">
        <!-- 顶部信息 -->
        <div class="seat-info-bar" id="seatInfoBar">
            <div class="seat-loading">加载中...</div>
        </div>

        <!-- 银幕示意 -->
        <div class="seat-screen">SCREEN</div>

        <!-- 座位布局 -->
        <div class="seat-grid" id="seatGrid"></div>

        <!-- 图例 -->
        <div class="seat-legend">
            <span><span class="legend-box available"></span> 可选</span>
            <span><span class="legend-box selected"></span> 已选</span>
            <span><span class="legend-box taken"></span> 已售</span>
        </div>

        <!-- 底部操作栏 -->
        <div class="seat-footer" id="seatFooter">
            <div class="seat-footer-info">
                <span id="selectedInfo">未选座</span>
                <span class="seat-total-price" id="totalPrice">¥0</span>
            </div>
            <button class="seat-confirm-btn" id="confirmBtn" disabled>确认购票</button>
        </div>
    </div>

    <div class="bottom">
        <div class="bottom-content">
            <span>版权所有 &copy; 2026 电影购票管理系统</span>
            <div class="bottom-links">
                <a href="#">关于我们</a>
                <a href="#">隐私政策</a>
                <a href="#">帮助中心</a>
            </div>
        </div>
    </div>

    <script src="../js/toast.js"></script>
    <script src="../js/seat.js"></script>
</body>
</html>
