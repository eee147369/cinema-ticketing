<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影</title>
    <link rel="stylesheet" href="../css/head.css">
    <link rel="stylesheet" href="../css/bottom.css">
    <link rel="stylesheet" href="../css/user-nav.css">
    <link rel="stylesheet" href="../css/movie.css">
    <link rel="stylesheet" href="../css/date-bar.css">
    <style>
    .movie-extras { max-width: 800px; margin: 0 auto; padding: 0 16px 40px; }
    .review-section { background: var(--cinema-surface); border-radius: 10px; padding: 20px 24px; border: 1px solid var(--cinema-border); }
    .review-section h3 { font-family: var(--font-display); font-size: 15px; color: var(--cinema-gold); letter-spacing: 2px; margin-bottom: 16px; }
    .review-item { padding: 14px 0; border-bottom: 1px solid var(--cinema-border); }
    .review-item:last-child { border-bottom: none; }
    .review-user { font-size: 13px; color: var(--cinema-text); font-weight: 600; }
    .review-stars { color: var(--cinema-gold); font-size: 12px; margin-left: 8px; letter-spacing: 1px; }
    .review-content { font-size: 14px; color: var(--cinema-text-muted); margin-top: 6px; line-height: 1.7; }
    .review-time { font-size: 11px; color: var(--cinema-text-dim); margin-top: 4px; }
    .review-empty { text-align: center; padding: 30px 0; color: var(--cinema-text-dim); font-size: 13px; }
    </style>
</head>
<body>
    <div class="whole">
    <!-- 顶部导航栏 -->
    <div class="head">
        <div class="nav-menu">
            <div class="head-img"><img src="电影.png" alt="logo"></div>
            <a class="nav-item" href="cinema.html">首页</a>
            <a class="nav-item-active" href="movie.html">电影</a>
            <a class="nav-item" href="cinema-detail.html">影院</a>
            <div class="nav-search">
                <input class="nav-search-input" id="searchInput" placeholder="搜索电影..." autocomplete="off">
                <div class="nav-search-results" id="searchResults"></div>
            </div>
            <div class="nav-item-two">
                <span class="avatar-inner">
                    <img src="个人.png" alt="用户" class="avatar-img" id="avatarTrigger">
                    <span class="avatar-label">登录</span>
                </span>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a class="dropdown-item" id="profileOption" href="#" data-tab="information">个人信息</a>
                    <a class="dropdown-item" id="ticketOption" href="#" data-tab="ticket">我的购票</a>
                    <a class="dropdown-item" href="#" data-tab="favorite">我的收藏</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item logout-item" id="logoutOption" href="#">退出登录</a>
                </div>
            </div>
            <script src="../js/script.js"></script>
        </div>
    </div>

    <!-- 电影子任务栏 -->
    <div style="padding-top:60px;"></div>
    <div class="movie-tab-bar">
        <button class="movie-tab active" data-tab="now">正在热映</button>
        <button class="movie-tab" data-tab="coming">即将上映</button>
    </div>

    <!-- 一、电影轮播区域 -->
    <div class="movie-hero">
        <div class="movie-carousel-wrapper">
            <button class="carousel-btn prev" id="carouselPrev">&#8249;</button>
            <div class="movie-carousel-track" id="carouselTrack"></div>
            <button class="carousel-btn next" id="carouselNext">&#8250;</button>
        </div>
        <!-- 电影信息 -->
        <div class="movie-info-panel" id="movieInfoPanel"></div>
    </div>

    <!-- 二、电影详情：简介 + 收藏 -->
    <div class="movie-detail-bar">
        <button class="movie-desc-btn" id="descToggleBtn">展开剧情简介</button>
        <div class="movie-desc" id="movieDesc"></div>
        <button class="movie-fav-btn" id="favBtn">&#9825; 收藏</button>
    </div>

    <!-- 三、日期选择区域 -->
    <div class="date-bar" id="dateBar"></div>

    <!-- 四、场次列表 -->
    <div class="showtime-section" id="showtimeList"></div>

    <!-- 四、电影评论区域 -->
    <div class="movie-extras">
        <div class="review-section">
            <h3>观众评论</h3>
            <div id="reviewList"><div class="review-empty">暂无评论</div></div>
        </div>
    </div>

    <!-- 底部 -->
    <div class="bottom">
        <div class="bottom-content">
            <span>版权所有 &copy; 2026 电影购票管理系统</span>
            <div class="bottom-links">
                <a href="#">关于我们</a>
                <a href="#">隐私政策</a>
                <a href="#">帮助中心</a>
            </div>
        </div>
    </div>
    </div>

    <script>
    // 子任务栏切换
    document.querySelectorAll('.movie-tab').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.movie-tab').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
        });
    });
    </script>
    <script src="../js/toast.js"></script>
    <script src="../js/movie.js"></script>
</body>
</html>
