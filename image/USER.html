<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理页面</title>
    <link rel="stylesheet" href="../css/head.css">
    <link rel="stylesheet" href="../css/bottom.css">
    <link rel="stylesheet" href="../css/user-nav.css">
    <link rel="stylesheet" href="../css/user-hero.css">
    <link rel="stylesheet" href="../css/user-panel.css">
    <link rel="stylesheet" href="../css/user-favorite.css">
</head>
<body>
    <!--头部设计-->
    <div class="head">
        <div class="nav-menu">
            <div class="head-img"><img src="电影.png" alt="logo"></div>
            <a class="nav-item-active" href="cinema.html">首页</a>
            <a class="nav-item" href="movie.html">电影</a>
            <a class="nav-item" href="cinema.html">影院</a>
            <div class="nav-item-two">
                <span class="avatar-inner">
                    <img src="个人.png" alt="用户" class="avatar-img" id="avatarTrigger">
                    <span class="avatar-label">登录</span>
                </span>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a class="dropdown-item" id="profileOption" href="#" data-tab="information">个人信息</a>
                    <a class="dropdown-item" id="ticketOption" href="#" data-tab="ticket">我的购票</a>
                    <a class="dropdown-item" href="#" data-tab="favorite">我的收藏</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item logout-item" id="logoutOption" href="#">退出登录</a>
                </div>
            </div>
        </div>
    </div>

    <!--Hero Banner-->
    <div class="hero-banner">
        <img src="风景2.jpg" alt="">
        <div class="hero-overlay">
            <h1>用户中心</h1>
            <p>管理您的个人信息与观影记录</p>
        </div>
    </div>

    <!--内容面板-->
    <div class="panel-container">
        <div class="panel panel-info active" id="panelInfo">
            <div class="info-row">
                <img src="id.png" alt="">
                <label>用户 ID</label>
                <span id="user_id">加载中...</span>
            </div>
            <div class="info-row">
                <img src="姓名.png" alt="">
                <label>用户姓名</label>
                <span id="user_name">加载中...</span>
            </div>
            <div class="info-row">
                <img src="手机号.png" alt="">
                <label>手机号码</label>
                <span id="phone">加载中...</span>
            </div>
            <div class="info-row">
                <img src="邮箱.png" alt="">
                <label>电子邮箱</label>
                <span id="email">加载中...</span>
            </div>
            <div class="info-row">
                <img src="时间.png" alt="">
                <label>注册时间</label>
                <span id="register_time">加载中...</span>
            </div>
        </div>

        <div class="panel panel-ticket" id="panelTicket">
            <div id="ticket-container">
                <p>加载中...</p>
            </div>
        </div>

        <div class="panel panel-favorite" id="panelFavorite">
            <div id="favorite-container">
                <p>加载中...</p>
            </div>
        </div>
    </div>

    <script src="../js/toast.js"></script>
    <script src="../js/script.js"></script>

    <!--底部样式-->
    <div class="bottom">
        <div class="bottom-content">
            <span>版权所有 © 2026 电影购票管理系统</span>
            <div class="bottom-links">
                <a href="#">关于我们</a>
                <a href="#">隐私政策</a>
                <a href="#">帮助中心</a>
            </div>
        </div>
    </div>
</body>
</html>
